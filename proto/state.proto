syntax = "proto3";

package rts.state;

// ─── 完整状态快照 (for replay + telemetry) ───

message GameStateSnapshot {
  int32   game_tick    = 1;
  bool    is_terminal  = 2;
  int32   winner       = 3;  // 0=none/Draw, 1=player1, 2=player2
  string termination_reason = 4;

  repeated EntityState entities  = 5;
  map<string, int32>  resources  = 6;  // "p1_mineral": 500, ...
  FogGrid             fog_p1     = 7;
  FogGrid             fog_p2     = 8;

  GameConfig          config     = 9;

  // Phase D: elevation grid — rows of heights [0..8], packed row-major
  repeated HeightRow  height_map = 10;

  // SC1 combat differentiation: authoritative combat events for this tick.
  // SimCore owns combat facts; Godot maps weapon_id -> visuals.
  repeated CombatEvent combat_events = 11;
}

// ─── 战斗事件类型 (SC1 combat differentiation) ───

enum CombatEventType {
  COMBAT_EVENT_UNSPECIFIED = 0;
  ATTACK_STARTED = 1;
  PROJECTILE_SPAWNED = 2;
  IMPACT_RESOLVED = 3;
  UNIT_DESTROYED = 4;
  SPELL_RESOLVED = 5;
}

// ─── 权威战斗事件 ───
// SimCore emits one record per attack/hit/death; Godot consumes it to drive
// animation, projectile, impact, shield ripple and audio.  No res:// paths,
// vfx_profile or Godot assets are referenced here (see ADR
// adr-combat-visual-events).

message CombatEvent {
  string event_id = 1;            // "tick:sequence" — deterministic per-tick id
  int32  tick = 2;                // tick the event was resolved
  CombatEventType event_type = 3; // ATTACK_STARTED, IMPACT_RESOLVED, ...
  string attacker_id = 4;        // source entity id ("" for spell/env)
  string target_id = 5;          // destination entity id ("" for miss)
  string weapon_id = 6;          // semantic weapon id, e.g. "terran_c10_rifle"

  float  source_x = 7;           // attacker position at resolution
  float  source_y = 8;
  float  target_x = 9;           // impact / destination position
  float  target_y = 10;

  string delivery_type = 11;     // melee|hitscan|projectile|chain|area_periodic|tracking
  string weapon_type = 12;       // normal|explosive|concussive|spells
  string armor_type = 13;        // light|medium|heavy

  float  base_damage = 14;       // pre-armor base damage for this hit
  float  final_damage = 15;      // post-armor, post-multiplier damage
  float  damage_multiplier = 16; // armor-type multiplier applied
  float  shield_damage = 17;     // damage absorbed by protoss shield
  float  health_damage = 18;    // damage applied to HP (after shield)

  string projectile_id = 19;    // projectile entity id, "" if hitscan/melee
  int32  chain_index = 20;       // bounce index (0 = primary), 0 if none
  bool   is_splash = 21;        // true if this hit is a splash instance
  float  splash_fraction = 22;  // fraction of primary damage (e.g. 1/3)
  bool   killed = 23;           // target died from this hit
  bool   missed = 24;           // attack missed (dodge/blind/high-ground)

  float  armor_value = 25;      // target armor used in final_damage
  float  shield_armor_value = 26; // protoss shield armor used
  int32  hit_index = 27;        // index within this attack cycle (0-based)
  int32  hit_count = 28;        // total hits in this attack cycle
}

// One row of height values for the elevation grid
message HeightRow {
  repeated int32 values = 1 [packed=true];
}

// ─── 实体状态 ───

message EntityState {
  string id            = 1;
  int32  owner         = 2;
  string entity_type  = 3;
  float  pos_x         = 4;
  float  pos_y         = 5;
  int32  health        = 6;
  int32  max_health   = 7;

  // Unit-specific
  float  speed         = 8;
  float  attack        = 9;
  float  attack_range  = 10;
  bool   is_idle       = 11;
  float  carry_amount  = 12;

  // Building-specific
  string building_type = 17;
  bool   is_constructing = 13;
  repeated string production_queue = 14;

  // Unit-specific (subtype)
  string unit_type = 18;

  // Movement / attack targeting state
  string attack_target_id = 19;  // "" if idle, else target entity ID
  float  target_x          = 20;  // current move/attack target position
  float  target_y          = 21;

  // Production timers (parallel to production_queue)
  repeated int32 production_timers = 22;

  // Resource-specific
  string resource_type = 15;
  float  resource_amount = 16;
}

// ─── 迷雾网格 ───

message FogGrid {
  repeated int32 tiles = 1 [packed=true];
  int32 width  = 2;
  int32 height = 3;
}

// ─── 游戏配置 ───

message GameConfig {
  int32  map_seed     = 1;
  int32  map_width    = 2;
  int32  map_height   = 3;
  int32  max_ticks    = 4;
  float  tick_rate    = 5;
  string game_mode    = 6;  // "1v1_skirmish", "2v2_team", etc.
  bool   enable_elevation = 7;  // Phase D: terrain height system
  map<string, string> player_races = 8;  // {"1": "terran", "2": "zerg"}
}